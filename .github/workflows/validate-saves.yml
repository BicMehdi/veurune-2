name: Validate Veyrune saves

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Install cloud save dependencies
        working-directory: worker
        run: npm ci
      - name: Test and type-check cloud save
        working-directory: worker
        run: npm test
      - name: Enforce append-only event journal
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: node rules/check-append-only.mjs "${{ github.event.pull_request.base.sha || github.event.before }}"
